<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Showdown Pro</title>
    <link rel="stylesheet" href="style.css?v=3">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Setup Screen -->
        <section id="setup-screen" class="screen">
            <div class="hero-card">
                <h1>TABLE SHOWDOWN</h1>
                <p>Infinite Family General Knowledge & Flag Identification.</p>
                <button class="primary-btn" onclick="startGame()">START SESSION</button>
            </div>
        </section>

        <!-- Quiz Screen -->
        <section id="quiz-screen" class="screen hidden">
            <header class="top-bar">
                <span id="round-indicator" class="badge">ROUND 1</span>
                <span id="progress-indicator" class="badge">1 / 5</span>
            </header>

            <div class="gameboard">
                <!-- Visual / Flag Display Area -->
                <div id="media-container" class="media-container hidden">
                    <img id="quiz-image" src="" alt="Country Flag">
                </div>

                <!-- 2x2 Options Grid (Positioned ABOVE Question) -->
                <div id="options-grid" class="options-grid"></div>

                <!-- Question Box (Positioned at BOTTOM) -->
                <div class="question-box">
                    <span id="category-tag" class="category-tag">General Knowledge</span>
                    <h2 id="question-text">Loading question...</h2>
                </div>
            </div>
        </section>

        <!-- Summary Screen -->
        <section id="summary-screen" class="screen hidden">
            <div class="hero-card">
                <h2>ROUND COMPLETE</h2>
                <div id="summary-score" class="summary-score">0 / 5</div>
                <p id="adaptive-feedback" class="feedback-text">Analyzing team performance...</p>
                <button class="primary-btn" onclick="startNextRound()">NEXT ROUND ➡️</button>
            </div>
        </section>
    </div>

    <script src="questions.js?v=3"></script>
    <script src="app.js?v=3"></script>
</body>
</html>
