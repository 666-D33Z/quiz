<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ DINNER SHOWDOWN ⚡</title>
    <!-- Canvas Confetti for Explosions -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&display=swap');

        :root {
            --neon-pink: #ff007f;
            --neon-blue: #00f0ff;
            --neon-green: #39ff14;
            --neon-yellow: #ffe600;
            --neon-purple: #9d00ff;
            --card-bg: rgba(20, 20, 35, 0.95);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #080811;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 650px;
            z-index: 1;
        }

        .glow-title {
            font-size: 2.2rem;
            font-weight: 900;
            text-align: center;
            margin: 0;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
        }

        .tagline {
            text-align: center;
            color: var(--neon-yellow);
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .hidden { display: none !important; }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            border: 3px solid var(--neon-blue);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
            margin-bottom: 20px;
        }

        .player-inputs {
            display: grid;
            gap: 12px;
            margin: 20px 0;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 800;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--neon-purple);
            border-radius: 12px;
            color: #fff;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-color: var(--neon-yellow);
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: 900;
            text-transform: uppercase;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 5px 0 rgba(0,0,0,0.5);
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.5);
        }

        .main-btn {
            background: linear-gradient(135deg, #39ff14 0%, #00b300 100%);
            color: #000;
        }

        .secondary-btn {
            background: linear-gradient(135deg, var(--neon-pink) 0%, #b30059 100%);
            color: #fff;
        }

        .quiz-status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .glow-pill {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 900;
        }

        .progress-bar-container {
            background: rgba(255, 255, 255, 0.1);
            height: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue), var(--neon-green));
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .badges {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .badge {
            background: var(--neon-purple);
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 900;
        }

        .type-badge {
            background: var(--neon-blue);
            color: #000;
        }

        .arcade-text {
            font-size: 1.6rem;
            line-height: 1.3;
            margin: 15px 0 20px 0;
            color: #fff;
        }

        /* Multiple Choice Buttons */
        .mc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .mc-btn {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--neon-blue);
            color: #fff;
            padding: 16px;
            font-weight: 800;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
        }

        .mc-btn.correct {
            background: var(--neon-green) !important;
            color: #000 !important;
            border-color: var(--neon-green) !important;
        }

        .mc-btn.wrong {
            background: var(--neon-pink) !important;
            color: #fff !important;
            opacity: 0.6;
        }

        .answer-box {
            margin-top: 15px;
            background: rgba(57, 255, 20, 0.15);
            border: 2px solid var(--neon-green);
            padding: 15px;
            border-radius: 12px;
        }

        .answer-label {
            color: var(--neon-green);
            font-weight: 900;
            font-size: 0.85rem;
        }

        .answer-box p {
            margin: 5px 0 0 0;
            font-size: 1.4rem;
            font-weight: 900;
            color: #fff;
        }

        .score-section h3 {
            text-align: center;
            color: var(--neon-yellow);
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .player-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .score-btn {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--neon-purple);
            color: #fff;
            padding: 14px;
            font-weight: 900;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
        }

        .score-btn.active {
            background: var(--neon-green);
            color: #000;
            border-color: var(--neon-green);
        }

        .scoreboard-list ul {
            list-style: none;
            padding: 0;
            margin: 15px 0;
        }

        .scoreboard-list li {
            background: rgba(0,0,0,0.8);
            padding: 14px 20px;
            margin-bottom: 10px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 1.3rem;
            font-weight: 900;
            border-left: 6px solid var(--neon-pink);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="glow-title">⚡ TABLE SHOWDOWN ⚡</h1>
            <p class="tagline">🔥 TRIVIA & LIST BATTLES 🔥</p>
        </header>

        <!-- Setup Screen -->
        <section id="setup-screen">
            <div class="card">
                <h2>🎮 SELECT YOUR SQUAD</h2>
                <p>Enter names for up to 4 players:</p>
                <div class="player-inputs">
                    <input type="text" id="p1" placeholder="⚡ Player 1 (Eldest)">
                    <input type="text" id="p2" placeholder="🔥 Player 2 (Youngest)">
                    <input type="text" id="p3" placeholder="👑 Player 3 (Mrs)">
                    <input type="text" id="p4" placeholder="🎯 Player 4 (You)">
                </div>
                <button class="btn main-btn" onclick="startGame()">🚀 START THE SHOW!</button>
            </div>
        </section>

        <!-- Quiz Screen -->
        <section id="quiz-screen" class="hidden">
            <div class="quiz-status-bar">
                <span id="round-info" class="pill glow-pill">ROUND 1</span>
                <span id="question-tracker" class="pill glow-pill">QUESTION 1/5</span>
            </div>

            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <div class="card">
                <div class="badges">
                    <span id="category-badge" class="badge">General</span>
                    <span id="type-badge" class="badge type-badge">Trivia</span>
                </div>
                <h2 id="question-text" class="arcade-text">Loading question...</h2>
                
                <!-- Multiple Choice Container -->
                <div id="mc-container" class="mc-grid hidden"></div>

                <!-- List Challenge Container -->
                <div id="list-container" class="hidden">
                    <button class="btn secondary-btn" onclick="toggleListAnswer()">📋 REVEAL ANSWERS</button>
                    <div id="list-answer-box" class="answer-box hidden">
                        <span class="answer-label">POSSIBLE ANSWERS:</span>
                        <p id="list-answer-text">Answer goes here</p>
                    </div>
                </div>
            </div>

            <!-- Score Awarding Grid for List Rounds -->
            <div id="score-section" class="score-section hidden">
                <h3 id="score-instruction">🏆 AWARD POINTS:</h3>
                <div id="player-score-controls" class="player-grid"></div>
            </div>

            <button id="next-btn" class="btn main-btn hidden" onclick="nextQuestion()">NEXT QUESTION ➡️</button>
        </section>

        <!-- Summary Screen -->
        <section id="summary-screen" class="hidden">
            <div class="card">
                <h2 class="glow-title">🎉 ROUND COMPLETE! 🎉</h2>
                <div id="scoreboard" class="scoreboard-list"></div>
                <button class="btn main-btn" onclick="startNextRound()">NEXT ROUND 🚀</button>
            </div>
        </section>
    </div>

    <script>
        // --- EMBEDDED QUESTION BANK ---
        const questionBank = {
            easy: [
                { type: "mc", category: "Geography", question: "What is the capital city of Australia?", options: ["Sydney", "Melbourne", "Canberra", "Perth"], answer: "Canberra" },
                { type: "mc", category: "General", question: "How many legs does a spider have?", options: ["6", "8", "10", "12"], answer: "8" },
                { type: "mc", category: "Geography", question: "Which US state is the largest by area?", options: ["Texas", "California", "Alaska", "Montana"], answer: "Alaska" },
                { type: "mc", category: "Sports", question: "How many players are on the pitch for one football team?", options: ["10", "11", "12", "9"], answer: "11" },
                { type: "list", category: "Geography", question: "Name English counties starting with 'B' (Max 4)", maxPoints: 4, answer: "Bedfordshire, Berkshire, Buckinghamshire, Bristol" },
                { type: "list", category: "Geography", question: "Name European countries starting with 'S'", maxPoints: 4, answer: "Spain, Sweden, Switzerland, Slovakia, Serbia, Slovenia" }
            ],
            medium: [
                { type: "mc", category: "History", question: "In what year did the Titanic sink?", options: ["1910", "1912", "1915", "1920"], answer: "1912" },
                { type: "mc", category: "Science", question: "What planet is known as the Red Planet?", options: ["Venus", "Mars", "Jupiter", "Saturn"], answer: "Mars" },
                { type: "mc", category: "Football", question: "Which team won the 2023/24 Premier League?", options: ["Arsenal", "Man City", "Liverpool", "Chelsea"], answer: "Man City" },
                { type: "list", category: "Football", question: "Name Scottish Premiership teams (Can you name 5?)", maxPoints: 5, answer: "Celtic, Rangers, Hearts, Hibernian, Aberdeen, St Mirren, Motherwell, etc." }
            ],
            hard: [
                { type: "mc", category: "Geography", question: "What is the capital of Kazakhstan?", options: ["Almaty", "Astana", "Tashkent", "Bishkek"], answer: "Astana" },
                { type: "list", category: "Geography", question: "Name US States starting with 'M' (There are 8 total!)", maxPoints: 8, answer: "Maine, Maryland, Massachusetts, Michigan, Minnesota, Mississippi, Missouri, Montana" }
            ]
        };

        // --- AUDIO SYNTH ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                osc.frequency.setValueAtTime(783.99, now + 0.16);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        // --- GAME LOGIC ---
        let players = [];
        let currentRoundQuestions = [];
        let currentQuestionIndex = 0;
        let currentRound = 1;
        const questionsPerRound = 5;
        let currentDifficulty = 'easy';
        let usedQuestionSet = new Set();

        function startGame() {
            players = [];
            for (let i = 1; i <= 4; i++) {
                let name = document.getElementById(`p${i}`).value.trim();
                if (name) players.push({ name: name, score: 0 });
            }
            if (players.length === 0) players.push({ name: "⚡ SQUAD", score: 0 });

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            startNewRound();
        }

        function startNewRound() {
            currentQuestionIndex = 0;
            let pool = questionBank[currentDifficulty] || questionBank['easy'];
            let available = pool.filter(q => !usedQuestionSet.has(q.question));
            if (available.length < questionsPerRound) {
                pool.forEach(q => usedQuestionSet.delete(q.question));
                available = [...pool];
            }
            shuffleArray(available);
            currentRoundQuestions = available.slice(0, questionsPerRound);
            currentRoundQuestions.forEach(q => usedQuestionSet.add(q.question));
            loadQuestion();
        }

        function loadQuestion() {
            let q = currentRoundQuestions[currentQuestionIndex];
            document.getElementById('category-badge').innerText = q.category;
            document.getElementById('type-badge').innerText = q.type === 'list' ? '📋 LIST BATTLE' : '❓ MULTIPLE CHOICE';
            document.getElementById('question-text').innerText = q.question;
            
            document.getElementById('round-info').innerText = `ROUND ${currentRound} (${currentDifficulty.toUpperCase()})`;
            document.getElementById('question-tracker').innerText = `QUESTION ${currentQuestionIndex + 1}/${questionsPerRound}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex) / questionsPerRound) * 100}%`;

            const mcContainer = document.getElementById('mc-container');
            const listContainer = document.getElementById('list-container');
            const scoreSection = document.getElementById('score-section');
            const nextBtn = document.getElementById('next-btn');

            if (q.type === 'mc') {
                mcContainer.classList.remove('hidden');
                listContainer.classList.add('hidden');
                scoreSection.classList.add('hidden');
                nextBtn.classList.add('hidden');
                renderMC(q);
            } else {
                mcContainer.classList.add('hidden');
                listContainer.classList.remove('hidden');
                scoreSection.classList.remove('hidden');
                nextBtn.classList.remove('hidden');
                document.getElementById('list-answer-box').classList.add('hidden');
                renderListScoring(q);
            }
        }

        function renderMC(q) {
            const container = document.getElementById('mc-container');
            container.innerHTML = '';
            let options = [...q.options];
            shuffleArray(options);

            options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'mc-btn';
                btn.innerText = opt;
                btn.onclick = () => {
                    let all = container.querySelectorAll('.mc-btn');
                    all.forEach(b => b.disabled = true);
                    if (opt === q.answer) {
                        btn.classList.add('correct');
                        playSound('correct');
                        players[0].score += 1;
                        if (window.confetti) confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
                    } else {
                        btn.classList.add('wrong');
                        playSound('wrong');
                        all.forEach(b => { if (b.innerText === q.answer) b.classList.add('correct'); });
                    }
                    document.getElementById('next-btn').classList.remove('hidden');
                };
                container.appendChild(btn);
            });
        }

        function toggleListAnswer() {
            document.getElementById('list-answer-box').classList.remove('hidden');
            document.getElementById('list-answer-text').innerText = currentRoundQuestions[currentQuestionIndex].answer;
        }

        function renderListScoring(q) {
            const container = document.getElementById('player-score-controls');
            container.innerHTML = '';
            players.forEach((p) => {
                let btn = document.createElement('button');
                btn.className = 'score-btn';
                btn.innerText = `${p.name} (+1 Pt)`;
                btn.onclick = () => {
                    p.score += 1;
                    playSound('correct');
                    if (window.confetti) confetti({ particleCount: 30, spread: 50 });
                };
                container.appendChild(btn);
            });
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex >= currentRoundQuestions.length) {
                showSummary();
            } else {
                loadQuestion();
            }
        }

        function showSummary() {
            if (window.confetti) confetti({ particleCount: 100, spread: 90 });
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('summary-screen').classList.remove('hidden');
            let sb = document.getElementById('scoreboard');
            let sorted = [...players].sort((a, b) => b.score - a.score);
            sb.innerHTML = '<ul>' + sorted.map(p => `<li><span>👑 ${p.name}</span> <span>${p.score} PTS</span></li>`).join('') + '</ul>';
        }

        function startNextRound() {
            currentRound++;
            if (currentRound === 3) currentDifficulty = 'medium';
            if (currentRound >= 5) currentDifficulty = 'hard';
            document.getElementById('summary-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            startNewRound();
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }
    </script>
</body>
</html>
